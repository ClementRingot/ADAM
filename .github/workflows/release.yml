name: Release

# One release per version: a tag v1.2.3 -> a GitHub Release with the Windows executable (no Node.js
# needed on the user's machine) and its checksum, and — once enabled — the npm package. Tags are
# normally pushed by the Changesets workflow (scripts/tag-missing-releases.mjs) after the version
# PR merges. Run it by hand to rebuild an existing tag's release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)build the release for (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Gate: install + version==tag + typecheck/lint/test/build. Nothing publishes
  # unless this passes.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify package.json and the build match the tag
        run: |
          npm run build
          WANT="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          BIN="$(node dist/index.js --version)"
          echo "tag=$WANT package.json=$PKG dist=$BIN"
          if [ "$WANT" != "$PKG" ] || [ "$WANT" != "$BIN" ]; then
            echo "::error::tag ($WANT), package.json ($PKG) and the build ($BIN) disagree"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # ---------------------------------------------------------------------------
  # Windows executable + checksum -> GitHub Release.
  # ---------------------------------------------------------------------------
  windows-exe:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:exe
      - name: Generate checksums
        shell: bash
        working-directory: build
        run: sha256sum abap-debugger-mcp.exe > SHA256SUMS.txt
      - name: Attach the executable to the release
        shell: bash
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" build/abap-debugger-mcp.exe build/SHA256SUMS.txt --clobber

  # ---------------------------------------------------------------------------
  # npmjs via Trusted Publishing (OIDC), off until the repository variable
  # NPM_PUBLISH is "true" (see docs/RELEASE.md, bootstrap). Idempotent: a
  # re-run skips publish if the version is already on npm.
  # ---------------------------------------------------------------------------
  npm-publish:
    needs: build
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing + provenance on npmjs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # Trusted Publishing requires npm >= 11.5; setup-node 22 ships npm 10.
      - name: Upgrade npm (for Trusted Publishing)
        run: npm install -g npm@latest
      - name: Publish to npmjs (skip if the version already exists)
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published — skipping npm publish"
          else
            npm publish --access public
          fi
